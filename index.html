<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusDirect - Trajets</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <header
      class="bg-blue-950 text-white p-3 sm:p-5 rounded-lg shadow-lg mb-6 text-center">
      <h1 class="text-3xl font-bold">BusDirect - Trajets</h1>
      <p>Tickets Total: <span id="tickets-total">0</span></p>
      <nav>
        <a class="underline flex justify-start" href="cabine.html">Cabine</a>
      </nav>
    </header>

    <main class="container mx-auto px-4">
      <div class="flex justify-center mb-5">
        <input
          placeholder="Chercher un trajet"
          class="rounded-xl w-full md:w-1/2 border p-2 text-center" type="search" id="search-trajet"/>
      </div>
      <div class="flex justify-end mb-5">
        <select id="filter-trajet" class="border rounded-lg p-2">
          <option>Tous</option>
          <option>Disponible</option>
          <option>Complet</option>
        </select>
      </div>
      <div>
        <p class="flex justify-center underline bg-purple-600 text-white text-lg border rounded-lg p-2">Liste des trajets</p>
        <div class="grid grid-cols-1 gap-5 p-5">
          <div class="card bg-white border rounded-xl shadow-md p-5">
            <h5 class="text-2xl font-bold">Safi → Marrakech</h5>
<p class="bg-yellow-500 rounded-md text-center p-2 mt-3">Places disponibles : 20 </p>
            <div class="flex justify-between items-center mt-4">
              <span class="bg-green-500 border rounded-md px-2 py-1 text-sm font-bold">Disponible</span>

              <a href="cabine.html"class="text-center border rounded-lg px-4 py-2 shadow-sm">Réserver
              </a>
            </div>
          </div>

          <div class="card bg-white border rounded-xl shadow-md p-5">
            <h5 class="text-2xl font-bold">Safi → Casablanca</h5>
            <p class="bg-yellow-500 rounded-md text-center p-2 mt-3">Places disponibles : 10</p>
            <div class="flex justify-between items-center mt-4">
              <span class="bg-green-500 border rounded-md px-2 py-1 text-sm font-bold">
                Disponible
              </span>
              <a href="cabine.html" class="text-center border rounded-lg px-4 py-2 shadow-sm">Réserver</a>
            </div>
          </div>

          <div class="card bg-white border rounded-xl shadow-md p-5">
            <h5 class="text-2xl font-bold">Safi → Agadir</h5>

            <p class="bg-yellow-500 rounded-md text-center p-2 mt-3">
              Places disponibles : 0
            </p>

            <div class="flex justify-between items-center mt-4">
              <span class="bg-red-700 text-white border rounded-md px-2 py-1 text-sm font-bold">Complet</span>
              <a href="#" class="text-center border rounded-lg px-4 py-2 shadow-sm">Réserver</a>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="p-4 mt-6">
      <div class="flex justify-center gap-2 p-3 rounded-lg">
        <button class="border rounded px-3 py-1">1</button>
        <button class="border rounded px-3 py-1">2</button>
        <button class="border rounded px-3 py-1">3</button>
      </div>
    </footer>
    <script type="module" src="js/main-trajets.js"></script>
  </body>
</html>
