<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusDirect - Trajets</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <header
      class="bg-blue-950 text-white p-3 sm:p-5 rounded-lg shadow-lg mb-6 text-center">
      <h1 class="text-3xl font-bold">BusDirect - Trajets</h1>
      <p>Tickets Total: <span id="tickets-total"></span></p>
      <p>Passager Total: <span id="tickets-total"></span></p>
      <nav>
        <a class="underline flex justify-start" href="cabine.html">Cabine</a>
      </nav>
    </header>

    <main class="container mx-auto px-4">
      <div class="flex justify-center mb-5">
        <input
          placeholder="Chercher un trajet"
          class="rounded-xl w-full md:w-1/2 border p-2 text-center" type="search" id="search-trajet"/>
      </div>
      <div class="flex justify-end mb-5">
        <select id="filter-trajet" class="border rounded-lg p-2">
          <option>Tous</option>
          <option>Disponible</option>
          <option>Complet</option>
        </select>
      </div>
      <div>



        <p class="flex justify-center underline bg-purple-600 text-white text-lg border rounded-lg p-2">Liste des trajets</p>
        <div id="list" class="grid grid-cols-3 gap-5 p-5">
          </div>











          </div>
        </div>
      </div>
    </main>
    <footer class="p-4 mt-6">
      <div class="flex justify-center gap-2 p-3 rounded-lg">
        <button class="border border-yellow-500 rounded px-3 py-1">1</button>
        <button class="border rounded px-3 py-1">2</button>
        <button class="border rounded px-3 py-1">3</button>
      </div>
    </footer>
    <script type="module" src="js/main-trajets.js"></script>
  </body>
</html>
